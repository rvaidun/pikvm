<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rahKVM</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #ddd;
    font: 13px/1.4 -apple-system, system-ui, sans-serif; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: 6px 10px; background: #111; border-bottom: 1px solid #222; }
  #bar .label { color: #888; }
  #bar .help { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .keys { display: flex; gap: 6px; }
  #status { padding: 2px 8px; border-radius: 3px; background: #222; color: #ccc; }
  #status.ok { background: #0a3a1a; color: #6fe09a; }
  #status.err { background: #3a0a0a; color: #ff8080; }
  button { background: #222; color: #ddd; border: 1px solid #333; padding: 4px 10px;
    border-radius: 3px; cursor: pointer; font: inherit; white-space: nowrap; }
  button:hover { background: #2a2a2a; }
  button.stop { background: #3a0a0a; border-color: #5a1a1a; color: #ff9a9a; }
  [popover] { position: fixed; inset: auto; right: 10px; margin: 0; padding: 8px;
    background: #161616; color: #ddd; border: 1px solid #333; border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  #more { width: 290px; max-height: calc(100vh - 60px); overflow-y: auto; }
  #more h4 { margin: 8px 6px 4px; font-size: 11px; font-weight: 600; color: #777;
    text-transform: uppercase; letter-spacing: 0.05em; }
  #more h4:first-child { margin-top: 2px; }
  #more .item { display: flex; justify-content: space-between; gap: 12px; width: 100%;
    background: transparent; border: none; padding: 5px 6px; text-align: left; }
  #more .item:hover { background: #2a2a2a; }
  #more kbd { font: 12px ui-monospace, Menlo, monospace; color: #999; }
  #more .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 0 2px; }
  #more .grid button { padding: 4px 0; }
  #more .slider { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  #more .slider input { flex: 1; min-width: 0; accent-color: #6fe09a; }
  #more .slider output { width: 3.2em; text-align: right; font: 12px ui-monospace, Menlo, monospace; color: #999; }
  #paste { width: 380px; }
  #paste textarea { box-sizing: border-box; width: 100%; height: 130px; resize: vertical;
    background: #0d0d0d; color: #ddd; border: 1px solid #333; border-radius: 4px; padding: 6px;
    font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #paste .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #paste .row .label { flex: 1; color: #888; font-size: 12px; }
  #stage { position: relative; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center; background: #000; }
  #video { max-width: 100%; max-height: 100%; display: block;
    image-rendering: -webkit-optimize-contrast; cursor: crosshair; }
  #capture { position: absolute; inset: 0; cursor: crosshair; }
  #hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); padding: 6px 12px; border-radius: 4px;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; font-size: 12px; }
  #hint.show { opacity: 1; }
  #toast { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,20,0.9); border: 1px solid #333; padding: 5px 12px; border-radius: 4px;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; font-size: 12px; }
  #toast.show { opacity: 1; }
  /* Full screen: the bar is hidden and slides back in over the video when the
     mouse touches the top edge (only while input isn't captured). */
  body.fs #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    transform: translateY(-100%); transition: transform 0.15s; box-shadow: 0 4px 16px rgba(0,0,0,0.6); }
  body.fs.peek #bar { transform: none; }
  #peekZone { display: none; position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 9; }
  body.fs #peekZone { display: block; }
</style>
</head>
<body>
  <div id="bar">
    <strong>rahKVM</strong>
    <span id="status">connecting…</span>
    <span class="label help">click video to capture input · Right ⌘, ⌘+⇧, or Esc to release</span>
    <!-- Keys the Mac or the browser won't pass through while captured. Each
         button taps its data-keys (event.code names, see HID below) together. -->
    <span class="keys">
      <button data-keys="Escape" title="Esc (the browser keeps it to release capture)">Esc</button>
      <button data-keys="MetaLeft" title="Windows key on its own: Start menu">Win</button>
      <button data-keys="ControlLeft AltLeft Delete">Ctrl+Alt+Del</button>
      <button popovertarget="more">More ▾</button>
      <button popovertarget="paste" title="Type text on the target as keystrokes">Paste text</button>
      <button id="typeStop" class="stop" hidden>Stop typing</button>
      <button id="fullscreen" title="Full screen: hides this bar; move the mouse to the top edge to bring it back">Full screen</button>
    </span>
  </div>
  <div id="peekZone"></div>

  <div id="more" popover>
    <h4>Windows</h4>
    <button class="item" data-keys="AltLeft Tab"><span>Switch window</span><kbd>Alt+Tab</kbd></button>
    <button class="item" data-keys="MetaLeft Tab"><span>Task view</span><kbd>Win+Tab</kbd></button>
    <button class="item" data-keys="AltLeft F4"><span>Close window</span><kbd>Alt+F4</kbd></button>
    <button class="item" data-keys="ControlLeft ShiftLeft Escape"><span>Task Manager</span><kbd>Ctrl+Shift+Esc</kbd></button>
    <button class="item" data-keys="MetaLeft KeyL"><span>Lock</span><kbd>Win+L</kbd></button>
    <button class="item" data-keys="MetaLeft KeyD"><span>Show desktop</span><kbd>Win+D</kbd></button>
    <button class="item" data-keys="MetaLeft KeyR"><span>Run</span><kbd>Win+R</kbd></button>
    <button class="item" data-keys="MetaLeft KeyE"><span>File Explorer</span><kbd>Win+E</kbd></button>
    <button class="item" data-keys="MetaLeft KeyX"><span>Power user menu</span><kbd>Win+X</kbd></button>
    <button class="item" data-keys="MetaLeft Space"><span>Switch input language</span><kbd>Win+Space</kbd></button>
    <button class="item" data-keys="MetaLeft ShiftLeft KeyS"><span>Snip screenshot</span><kbd>Win+Shift+S</kbd></button>
    <button class="item" data-keys="PrintScreen"><span>Print Screen</span><kbd>PrtSc</kbd></button>
    <h4>Display</h4>
    <button class="item" data-keys="MetaLeft KeyP"><span>Projection mode</span><kbd>Win+P</kbd></button>
    <button class="item" data-keys="MetaLeft ControlLeft ShiftLeft KeyB"><span>Restart graphics driver</span><kbd>Win+Ctrl+Shift+B</kbd></button>
    <h4>Function keys</h4>
    <div class="grid">
      <button data-keys="F1">F1</button><button data-keys="F2">F2</button>
      <button data-keys="F3">F3</button><button data-keys="F4">F4</button>
      <button data-keys="F5">F5</button><button data-keys="F6">F6</button>
      <button data-keys="F7">F7</button><button data-keys="F8">F8</button>
      <button data-keys="F9">F9</button><button data-keys="F10">F10</button>
      <button data-keys="F11">F11</button><button data-keys="F12">F12</button>
    </div>
    <h4>Other keys</h4>
    <div class="grid">
      <button data-keys="Insert" title="Insert">Ins</button>
      <button data-keys="Delete" title="Delete">Del</button>
      <button data-keys="Pause" title="Pause / Break">Pause</button>
      <button data-keys="ContextMenu" title="Menu (application) key">Menu</button>
      <button data-keys="NumLock" title="Num Lock">NumLk</button>
      <button data-keys="ScrollLock" title="Scroll Lock">ScrLk</button>
    </div>
    <h4>Mouse</h4>
    <label class="slider">
      <span>Scroll speed</span>
      <input id="scrollSpeed" type="range" min="0" max="9" step="1" value="5">
      <output id="scrollSpeedOut">1×</output>
    </label>
    <h4>Stuck keys</h4>
    <button class="item" id="releaseAll"><span>Release all keys and buttons</span><kbd></kbd></button>
  </div>

  <div id="paste" popover>
    <textarea id="pasteText" spellcheck="false"
      placeholder="Paste or write text here, then send it to the target as keystrokes (US layout)."></textarea>
    <div class="row">
      <span id="pasteInfo" class="label">⌘+Enter to send</span>
      <button id="pasteGo">Type it</button>
    </div>
  </div>

  <div id="stage">
    <img id="video" alt="screen">
    <div id="capture"></div>
    <div id="hint">input captured — press Esc to release</div>
    <div id="toast"></div>
  </div>

<script>
// Browser event.code -> USB HID usage ID
const HID = {
  KeyA:4,KeyB:5,KeyC:6,KeyD:7,KeyE:8,KeyF:9,KeyG:10,KeyH:11,KeyI:12,KeyJ:13,
  KeyK:14,KeyL:15,KeyM:16,KeyN:17,KeyO:18,KeyP:19,KeyQ:20,KeyR:21,KeyS:22,KeyT:23,
  KeyU:24,KeyV:25,KeyW:26,KeyX:27,KeyY:28,KeyZ:29,
  Digit1:30,Digit2:31,Digit3:32,Digit4:33,Digit5:34,
  Digit6:35,Digit7:36,Digit8:37,Digit9:38,Digit0:39,
  Enter:40,Escape:41,Backspace:42,Tab:43,Space:44,
  Minus:45,Equal:46,BracketLeft:47,BracketRight:48,Backslash:49,
  Semicolon:51,Quote:52,Backquote:53,Comma:54,Period:55,Slash:56,
  CapsLock:57,
  F1:58,F2:59,F3:60,F4:61,F5:62,F6:63,F7:64,F8:65,F9:66,F10:67,F11:68,F12:69,
  PrintScreen:70,ScrollLock:71,Pause:72,
  Insert:73,Home:74,PageUp:75,Delete:76,End:77,PageDown:78,
  ArrowRight:79,ArrowLeft:80,ArrowDown:81,ArrowUp:82,
  NumLock:83,NumpadDivide:84,NumpadMultiply:85,NumpadSubtract:86,NumpadAdd:87,NumpadEnter:88,
  Numpad1:89,Numpad2:90,Numpad3:91,Numpad4:92,Numpad5:93,
  Numpad6:94,Numpad7:95,Numpad8:96,Numpad9:97,Numpad0:98,NumpadDecimal:99,
  ContextMenu:101,
  ControlLeft:224,ShiftLeft:225,AltLeft:226,MetaLeft:227,
  ControlRight:228,ShiftRight:229,AltRight:230,MetaRight:231,
};

const video = document.getElementById('video');
const capture = document.getElementById('capture');
const statusEl = document.getElementById('status');
const hint = document.getElementById('hint');

// Point <img> at ustreamer on same host (port 8080).
const STREAM_HOST = `http://${location.hostname}:8080`;
function loadVideo() { video.src = `${STREAM_HOST}/stream?t=${Date.now()}`; }
video.onerror = () => setTimeout(loadVideo, 1000);
loadVideo();
// When ustreamer restarts (kvm-ustreamer restart re-detects the display), the
// MJPEG connection just ends: no error event, the last frame stays up. Poll
// it and reconnect once it's back after being unreachable.
let streamDown = false;
setInterval(async () => {
  try {
    await fetch(`${STREAM_HOST}/state`, { mode: 'no-cors', cache: 'no-store' });
    if (streamDown) { streamDown = false; loadVideo(); }
  } catch {
    streamDown = true;
  }
}, 1000);

// --- WebSocket ---
let ws = null;
function setStatus(txt, cls) {
  statusEl.textContent = txt;
  statusEl.className = cls || '';
}
function connect() {
  const url = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`;
  ws = new WebSocket(url);
  ws.onopen  = () => setStatus('connected', 'ok');
  ws.onclose = () => { setStatus('disconnected — reconnecting', 'err'); setTimeout(connect, 1000); };
  ws.onerror = () => setStatus('error', 'err');
}
function send(line) { if (ws && ws.readyState === 1) ws.send(line); }
connect();

// --- Pointer lock ---
let locked = false;
capture.addEventListener('click', () => {
  if (!locked) capture.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  locked = (document.pointerLockElement === capture);
  hint.classList.toggle('show', locked);
});

// --- Keyboard ---
function onKey(e, down) {
  if (!locked) return;
  // Right Command on Mac = escape hatch; swallow it, release pointer lock.
  if (e.code === 'MetaRight') {
    e.preventDefault();
    if (down) document.exitPointerLock();
    return;
  }
  // Cmd+Shift (either side) = never pass through — protects against
  // Mac's Cmd+Shift+3/4/5 screenshot keys firing on the target. The
  // Mac still gets its system shortcut (OS intercepts those before the
  // browser can preventDefault), we just make sure the KVM target doesn't.
  if (e.metaKey && e.shiftKey) {
    e.preventDefault();
    if (down) document.exitPointerLock();
    return;
  }
  const code = HID[e.code];
  if (code == null) return;
  e.preventDefault();
  // Left Command is held back until another key goes down with it. macOS
  // eats Cmd+Tab, so the target would otherwise see Win pressed and released
  // alone (on the release-all as focus leaves) and open the Start menu. A
  // lone Cmd tap therefore does nothing; Ctrl+Esc opens Start.
  if (e.code === 'MetaLeft') {
    if (down) { metaHeld = true; return; }
    metaHeld = false;
    if (!metaSent) return;
    metaSent = false;
  } else if (down && metaHeld && !metaSent) {
    send(`kd ${HID.MetaLeft}`);
    metaSent = true;
  }
  send(`${down ? 'kd' : 'ku'} ${code}`);
}
let metaHeld = false, metaSent = false;
window.addEventListener('keydown', e => onKey(e, true));
window.addEventListener('keyup',   e => onKey(e, false));

// Browser steals Esc to unlock pointer; also release all keys on unlock.
document.addEventListener('pointerlockchange', () => {
  if (!locked) { send('krel'); metaHeld = metaSent = false; }
});

// --- Mouse ---
const BTN = { 0: 1, 1: 4, 2: 2 };  // browser.button -> HID button bit

// Browser fires 200-500 mousemove events/sec; coalesce at animation frame
// rate (~60Hz) and split large deltas into int8 chunks.
let mdx = 0, mdy = 0, flushQueued = false;
function flushMouse() {
  flushQueued = false;
  while (mdx !== 0 || mdy !== 0) {
    const dx = Math.max(-127, Math.min(127, mdx));
    const dy = Math.max(-127, Math.min(127, mdy));
    send(`mm ${dx} ${dy}`);
    mdx -= dx; mdy -= dy;
  }
}
capture.addEventListener('mousemove', e => {
  if (!locked) return;
  mdx += (e.movementX | 0);
  mdy += (e.movementY | 0);
  if (!flushQueued) { flushQueued = true; requestAnimationFrame(flushMouse); }
});
capture.addEventListener('mousedown', e => {
  if (!locked) return;
  e.preventDefault();
  const b = BTN[e.button]; if (b) send(`md ${b}`);
});
capture.addEventListener('mouseup', e => {
  if (!locked) return;
  e.preventDefault();
  const b = BTN[e.button]; if (b) send(`mu ${b}`);
});
capture.addEventListener('contextmenu', e => e.preventDefault());
// A Mac trackpad or Magic Mouse sends a stream of small pixel deltas (~60 a
// second, plus momentum after the fingers lift), but each HID wheel step is a
// whole notch, which Windows scrolls 3 lines (~100 px). So add the deltas up
// and send a notch per WHEEL_PX_PER_NOTCH, scaled by the scroll speed setting.
// A new gesture, or a change of direction, scrolls one notch right away, so a
// single click of a real wheel still does something.
const WHEEL_PX_PER_NOTCH = 100;
const WHEEL_GAP_MS = 250;   // a pause this long starts a new gesture
const SCROLL_SPEEDS = [0.2, 0.3, 0.4, 0.5, 0.7, 1, 1.5, 2, 3, 4];
const scrollInput = document.getElementById('scrollSpeed');
const scrollOut = document.getElementById('scrollSpeedOut');
let scrollSpeed = 1;
function applyScrollSpeed() {
  scrollSpeed = SCROLL_SPEEDS[scrollInput.value] ?? 1;
  scrollOut.textContent = `${scrollSpeed}×`;
}
try {
  const saved = localStorage.getItem('scrollSpeed');
  if (saved != null && SCROLL_SPEEDS[saved] != null) scrollInput.value = saved;
} catch {}
applyScrollSpeed();
scrollInput.addEventListener('input', () => {
  applyScrollSpeed();
  try { localStorage.setItem('scrollSpeed', scrollInput.value); } catch {}
});

let wheelAcc = 0, wheelLast = 0;
capture.addEventListener('wheel', e => {
  if (!locked) return;
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 800 : 1;   // lines / pages -> px
  const px = e.deltaY * unit * scrollSpeed;
  if (!px) return;
  const now = performance.now();
  if (now - wheelLast > WHEEL_GAP_MS || px * wheelAcc < 0) {
    wheelAcc = Math.sign(px) * Math.max(Math.abs(px), WHEEL_PX_PER_NOTCH);
  } else {
    wheelAcc += px;
  }
  wheelLast = now;
  const notches = Math.trunc(wheelAcc / WHEEL_PX_PER_NOTCH);
  if (!notches) return;
  wheelAcc -= notches * WHEEL_PX_PER_NOTCH;
  send(`mw ${Math.max(-127, Math.min(127, -notches))}`);
}, { passive: false });

// --- Toast ---
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
}
function connected() {
  if (ws && ws.readyState === 1) return true;
  toast('not connected');
  return false;
}

// --- Key buttons ---
// Press the keys in order, hold briefly, release in reverse.
function tap(codes) {
  codes.forEach(c => send(`kd ${c}`));
  setTimeout(() => codes.slice().reverse().forEach(c => send(`ku ${c}`)), 60);
}
const more = document.getElementById('more');
for (const btn of document.querySelectorAll('[data-keys]')) {
  const codes = btn.dataset.keys.split(' ').map(name => HID[name]);
  if (codes.includes(undefined)) console.error('unknown key in', btn.dataset.keys);
  btn.addEventListener('click', () => {
    btn.blur();
    if (more.contains(btn)) more.hidePopover();
    if (!connected()) return;
    tap(codes);
    toast(`sent ${btn.querySelector('kbd')?.textContent || btn.textContent}`);
  });
}
document.getElementById('releaseAll').addEventListener('click', () => {
  more.hidePopover();
  stopTyping();
  if (!connected()) return;
  send('krel');
  send('mu 7');
  toast('released all keys');
});

// Popovers open just under the bar, which can wrap onto two lines.
const bar = document.getElementById('bar');
for (const pop of document.querySelectorAll('[popover]')) {
  pop.addEventListener('beforetoggle', e => {
    if (e.newState === 'open') pop.style.top = `${bar.offsetHeight + 4}px`;
  });
}

// --- Paste text: type it on the target as keystrokes (US layout) ---
const CHAR_KEYS = {};   // char -> [HID code, needs shift]
function addChars(plain, shifted, codes) {
  [...plain].forEach((ch, i) => CHAR_KEYS[ch] = [codes[i], false]);
  [...shifted].forEach((ch, i) => CHAR_KEYS[ch] = [codes[i], true]);
}
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
addChars('abcdefghijklmnopqrstuvwxyz', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', range(HID.KeyA, HID.KeyZ + 1));
addChars('1234567890', '!@#$%^&*()', range(HID.Digit1, HID.Digit0 + 1));
addChars('-=[]\\;\'`,./', '_+{}|:"~<>?',
  ['Minus','Equal','BracketLeft','BracketRight','Backslash','Semicolon','Quote',
   'Backquote','Comma','Period','Slash'].map(n => HID[n]));
addChars(' \n\t', '', [HID.Space, HID.Enter, HID.Tab]);

const KEY_MS = 8;   // between each key down/up; the bridge also waits for the host to poll
const paste = document.getElementById('paste');
const pasteText = document.getElementById('pasteText');
const pasteInfo = document.getElementById('pasteInfo');
const typeStop = document.getElementById('typeStop');
let typing = null;

function untypable(text) {
  return [...new Set([...text].filter(ch => !CHAR_KEYS[ch]))];
}
function updatePasteInfo() {
  const bad = untypable(pasteText.value.replace(/\r/g, ''));
  pasteInfo.textContent = bad.length
    ? `will skip: ${bad.slice(0, 8).join(' ')}${bad.length > 8 ? ' …' : ''}`
    : '⌘+Enter to send';
}
pasteText.addEventListener('input', updatePasteInfo);
paste.addEventListener('toggle', e => { if (e.newState === 'open') pasteText.focus(); });

function stopTyping() {
  if (typing) typing.stop = true;
}
async function typeText(text) {
  stopTyping();
  const job = typing = { stop: false };
  const chars = [...text.replace(/\r/g, '')];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  typeStop.hidden = false;
  let done = 0;
  for (const ch of chars) {
    if (job.stop) break;
    const k = CHAR_KEYS[ch];
    if (k) {
      const [code, shift] = k;
      if (shift) send(`kd ${HID.ShiftLeft}`);
      send(`kd ${code}`);
      await sleep(KEY_MS);
      send(`ku ${code}`);
      if (shift) send(`ku ${HID.ShiftLeft}`);
      await sleep(KEY_MS);
    }
    done++;
    typeStop.textContent = `Stop typing (${done}/${chars.length})`;
  }
  send('krel');
  if (typing === job) { typing = null; typeStop.hidden = true; }
  toast(job.stop ? `stopped after ${done} of ${chars.length} characters` : `typed ${chars.length} characters`);
}
function sendPaste() {
  const text = pasteText.value;
  if (!text || !connected()) return;
  paste.hidePopover();
  typeText(text);
}
document.getElementById('pasteGo').addEventListener('click', sendPaste);
pasteText.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendPaste(); }
});
typeStop.addEventListener('click', stopTyping);

// --- Full screen ---
// Esc releases capture first; a second Esc (or the button) leaves full screen.
const fsBtn = document.getElementById('fullscreen');
const peekZone = document.getElementById('peekZone');
fsBtn.addEventListener('click', () => {
  fsBtn.blur();
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(err => toast(`full screen failed: ${err.message}`));
});
function setPeek(on) { document.body.classList.toggle('peek', on && !locked); }
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  document.body.classList.toggle('fs', fs);
  fsBtn.textContent = fs ? 'Exit full screen' : 'Full screen';
  setPeek(false);
});
peekZone.addEventListener('mouseenter', () => setPeek(true));
bar.addEventListener('mouseleave', () => {
  // Keep the bar up while one of its menus is open.
  if (!document.querySelector('[popover]:popover-open')) setPeek(false);
});
for (const pop of document.querySelectorAll('[popover]')) {
  pop.addEventListener('toggle', e => {
    if (e.newState === 'closed' && !bar.matches(':hover')) setPeek(false);
  });
}
document.addEventListener('pointerlockchange', () => { if (locked) setPeek(false); });
</script>
</body>
</html>
